name: ses-test
on:
  workflow_dispatch:
jobs:
  ses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install edge-tts
      - run: python ses_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: sesler
          path: "*.mp3"
          if-no-files-found: warn