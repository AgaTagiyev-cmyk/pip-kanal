- id: renk-kirmizi
  mode: replace
  labels: ["RED", "RED", "RED"]
  objects: ["balloon", "apple", "ball"]
  color: red
  cues: ["balloon", "apple", "ball"]
  title: "Learn the Colour Red | Balloon, Apple, Ball for Toddlers"
  description: "Three red things, one at a time. Calm pace with real thinking pauses."
  parts:
    - {text: "Hi! It's Pip again!", speaker: mascot, pause: 0.5}
    - {text: "Today we are learning the colour red.", speaker: narrator, pause: 0.9}
    - {text: "A red balloon.", speaker: narrator, pause: 1.0}
    - {text: "A red apple.", speaker: narrator, pause: 1.0}
    - {text: "A red ball.", speaker: narrator, pause: 1.0}
    - {text: "Everything here is red!", speaker: narrator, pause: 0.8}
    - {text: "Can you spot something red near you? Have a look!", speaker: mascot, pause: 4.0}
    - {text: "Brilliant! That's red!", speaker: mascot, pause: 0.4}

- id: sekiller
  mode: replace
  labels: ["CIRCLE", "SQUARE", "TRIANGLE"]
  objects: ["circle", "square", "triangle"]
  color: blue
  cues: ["circle", "square", "triangle"]
  title: "Circle, Square, Triangle | Learn Shapes for Preschool"
  description: "Three first shapes with Pip. Slow, gentle and easy to follow."
  parts:
    - {text: "Hello! Shall we look at shapes?", speaker: mascot, pause: 0.7}
    - {text: "Let's learn three shapes today.", speaker: narrator, pause: 0.9}
    - {text: "A circle. Round and round.", speaker: narrator, pause: 1.1}
    - {text: "A square. Four equal sides.", speaker: narrator, pause: 1.1}
    - {text: "A triangle. Three sides.", speaker: narrator, pause: 1.1}
    - {text: "Which shape do you like best? Point to it!", speaker: mascot, pause: 4.0}
    - {text: "Good choice! Well done!", speaker: mascot, pause: 0.4} 