- id: sayma-1-5-balon
  mode: accumulate
  label: count
  objects: ["balloon"]
  color: red
  cues: ["one", "two", "three", "four", "five"]
  thumb_text: "1 2 3"
  title: "Count to 5 with Red Balloons | Learn Numbers for Toddlers"
  description: "Shall we count to five? Slow, calm counting with Pip. Ages 3-6."
  parts:
    - {text: "Hello! I'm Pip!", speaker: mascot, pause: 0.5}
    - {text: "Shall we count together today?", speaker: mascot, pause: 0.8}
    - {text: "Let's count the balloons. Ready?", speaker: narrator, pause: 0.9}
    - {text: "One.", speaker: narrator, pause: 0.6}
    - {text: "Two.", speaker: narrator, pause: 0.6}
    - {text: "Three.", speaker: narrator, pause: 0.6}
    - {text: "Four.", speaker: narrator, pause: 0.6}
    - {text: "Five.", speaker: narrator, pause: 0.9}
    - {text: "Five red balloons.", speaker: narrator, pause: 0.8}
